
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>顔認証テスト</title>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 16px;
      background: #f5f7fa;
    }

    h1 { font-size: 26px; }

    #status {
      font-size: 18px;
      font-weight: bold;
      white-space: pre-line;
    }

    button {
      font-size: 18px;
      padding: 12px 20px;
      margin: 8px;
      border-radius: 10px;
      cursor: pointer;
    }

    #cameraArea {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 16px auto;
      line-height: 0;
    }

    video, canvas {
      width: 100%;
      height: auto;
      border-radius: 12px;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    #result {
      font-size: 20px;
      font-weight: bold;
      white-space: pre-line;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <h1>顔認証テスト</h1>

  <p id="status">カメラを起動してください</p>

  <button id="startButton" onclick="startCamera()">
    カメラを起動
  </button>

  <button id="stopButton" onclick="stopCamera()" disabled>
    カメラを停止
  </button>

  <div id="cameraArea">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <p id="result">このテストでは顔の検出のみを行います。</p>

  <script>
    const MODEL_URL =
      "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";

    const video = document.getElementById("video");
    const canvas = document.getElementById("overlay");
    const statusText = document.getElementById("status");
    const resultText = document.getElementById("result");
    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");

    let stream = null;
    let running = false;
    let busy = false;
    let modelsLoaded = false;
    let lastFaceCount = -1;

    async function startCamera() {
      if (running) return;

      startButton.disabled = true;
      statusText.textContent = "顔認識モデルを準備しています…";

      try {
        if (!modelsLoaded) {
          await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
          modelsLoaded = true;
        }

        statusText.textContent = "カメラを起動しています…";

        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: "user",
            width: { ideal: 640 },
            height: { ideal: 480 }
          }
        });

        video.srcObject = stream;
        await video.play();

        await new Promise(resolve => {
          if (video.readyState >= 2) {
            resolve();
          } else {
            video.onloadeddata = resolve;
          }
        });

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        running = true;
        lastFaceCount = -1;

        startButton.disabled = true;
        stopButton.disabled = false;

        statusText.textContent = "カメラ起動中";
        resultText.textContent = "カメラに顔を向けてください。";

        detectFaces();

      } catch (error) {
        stopCamera();

        statusText.textContent = "起動できませんでした";
        resultText.textContent =
          "エラー：" + error.message +
          "\nインターネット接続、カメラの許可、モデルの読み込みを確認してください。";

        startButton.disabled = false;
      }
    }

    async function detectFaces() {
      if (!running || busy) return;

      busy = true;

      try {
        const detections = await faceapi.detectAllFaces(
          video,
          new faceapi.TinyFaceDetectorOptions({
            inputSize: 320,
            scoreThreshold: 0.5
          })
        );

        if (!running) return;

        const displaySize = {
          width: video.videoWidth,
          height: video.videoHeight
        };

        const resized = faceapi.resizeResults(
          detections,
          displaySize
        );

        const context = canvas.getContext("2d");
        context.clearRect(0, 0, canvas.width, canvas.height);

        faceapi.draw.drawDetections(canvas, resized);

        const count = detections.length;

        if (count !== lastFaceCount) {
          lastFaceCount = count;

          if (count === 0) {
            resultText.textContent = "顔が見つかりません。カメラを見てください。";
          } else if (count === 1) {
            resultText.textContent = "顔を検出しました！";
          } else {
            resultText.textContent =
              count + "人の顔を検出しました。1人ずつ映ってください。";
          }
        }

        statusText.textContent = "顔を検出しています…";

      } catch (error) {
        statusText.textContent = "顔の検出中にエラーが発生しました";
      } finally {
        busy = false;

        if (running) {
          setTimeout(detectFaces, 100);
        }
      }
    }

    function stopCamera() {
      running = false;

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;

      const context = canvas.getContext("2d");
      context.clearRect(0, 0, canvas.width, canvas.height);

      startButton.disabled = false;
      stopButton.disabled = true;

      statusText.textContent = "カメラを停止しました";
      resultText.textContent = "もう一度試す場合はカメラを起動してください。";
    }
  </script>
</body>
</html>
